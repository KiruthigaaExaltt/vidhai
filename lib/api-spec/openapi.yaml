openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Vidhai ERP API — multi-site mushroom farming production orchestration
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: locations
    description: Farm locations
  - name: alertColors
    description: Alert color master
  - name: materials
    description: Raw material master
  - name: inventory
    description: Raw material inventory stock
  - name: spawn
    description: Spawn inventory
  - name: batches
    description: Production batch management
  - name: batchMaterials
    description: Batch formulation materials
  - name: batchStages
    description: Batch stage progression
  - name: chambers
    description: Rooms and chambers
  - name: chamberReadings
    description: Chamber sensor readings
  - name: dashboard
    description: Dashboard aggregates
  - name: coimbatore
    description: Coimbatore casing soil batches (Location C)
  - name: lab
    description: Lab spawn production batches (Location D)
  - name: ooty
    description: Ooty mushroom growing rooms (Location B)
  - name: traceability
    description: Cross-location batch genealogy
  - name: scheduling
    description: Orchestration scheduling engine
  - name: sales
    description: Unified sales and dispatch orders
  - name: fleet
    description: Vehicle and fleet management
  - name: reports
    description: Production and operational reports
  - name: tasks
    description: Task management board
  - name: inventoryMovements
    description: Inter-location inventory transfers
  - name: casingSoil
    description: Casing soil buy/sell transactions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /locations:
    get:
      operationId: listLocations
      tags: [locations]
      summary: List all farm locations
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"

  /alert-colors:
    get:
      operationId: listAlertColors
      tags: [alertColors]
      summary: List all alert color definitions
      responses:
        "200":
          description: Alert colors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlertColor"
    post:
      operationId: createAlertColor
      tags: [alertColors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertColorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertColor"

  /alert-colors/{id}:
    patch:
      operationId: updateAlertColor
      tags: [alertColors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertColorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertColor"
    delete:
      operationId: deleteAlertColor
      tags: [alertColors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /materials:
    get:
      operationId: listMaterials
      tags: [materials]
      summary: List all raw material definitions
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Material"
    post:
      operationId: createMaterial
      tags: [materials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"

  /materials/{id}:
    patch:
      operationId: updateMaterial
      tags: [materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Material"
    delete:
      operationId: deleteMaterial
      tags: [materials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all CRM contacts
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [contacts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List current raw material stock levels
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryAdjustment
      tags: [inventory]
      summary: Add or adjust stock for a material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryAdjustmentInput"
      responses:
        "201":
          description: Adjustment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /spawn:
    get:
      operationId: listSpawnEntries
      tags: [spawn]
      summary: List spawn inventory entries
      responses:
        "200":
          description: Spawn entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpawnEntry"
    post:
      operationId: createSpawnEntry
      tags: [spawn]
      summary: Add spawn stock entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpawnEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpawnEntry"

  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      summary: List all batches
      parameters:
        - name: locationId
          in: query
          required: false
          schema: { type: ["integer", "null"] }
        - name: stage
          in: query
          required: false
          schema: { type: ["string", "null"] }
        - name: status
          in: query
          required: false
          schema: { type: ["string", "null"] }
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
    post:
      operationId: createBatch
      tags: [batches]
      summary: Create a new batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}:
    get:
      operationId: getBatch
      tags: [batches]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Batch detail with full stage history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetail"
    patch:
      operationId: updateBatch
      tags: [batches]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}/advance:
    post:
      operationId: advanceBatchStage
      tags: [batches]
      summary: Advance batch to next stage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageAdvanceInput"
      responses:
        "200":
          description: Batch with updated stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /batches/{id}/materials:
    get:
      operationId: getBatchMaterials
      tags: [batchMaterials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Batch material rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchMaterial"
    post:
      operationId: addBatchMaterial
      tags: [batchMaterials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMaterialInput"
      responses:
        "201":
          description: Material row added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchMaterial"

  /batches/{id}/materials/{materialRowId}:
    patch:
      operationId: updateBatchMaterial
      tags: [batchMaterials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: materialRowId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchMaterialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchMaterial"
    delete:
      operationId: deleteBatchMaterial
      tags: [batchMaterials]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: materialRowId, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /batches/{id}/stage-logs:
    get:
      operationId: getBatchStageLogs
      tags: [batchStages]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Stage history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StageLog"

  /chambers:
    get:
      operationId: listChambers
      tags: [chambers]
      parameters:
        - name: locationId
          in: query
          required: false
          schema: { type: ["integer", "null"] }
      responses:
        "200":
          description: Chambers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chamber"
    post:
      operationId: createChamber
      tags: [chambers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChamberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chamber"

  /chambers/{id}:
    get:
      operationId: getChamber
      tags: [chambers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Chamber detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chamber"
    patch:
      operationId: updateChamber
      tags: [chambers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChamberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chamber"
    delete:
      operationId: deleteChamber
      tags: [chambers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /chambers/{id}/readings:
    get:
      operationId: getChamberReadings
      tags: [chamberReadings]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Recent readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChamberReading"
    post:
      operationId: createChamberReading
      tags: [chamberReadings]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChamberReadingInput"
      responses:
        "201":
          description: Reading recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChamberReading"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard aggregate stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Recent batch activity feed
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  # ── COIMBATORE ──────────────────────────────────────────────────────────────
  /coimbatore/batches:
    get:
      operationId: listCoimbatoreBatches
      tags: [coimbatore]
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoimbatoreBatch" }
    post:
      operationId: createCoimbatoreBatch
      tags: [coimbatore]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoimbatoreBatchInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoimbatoreBatch" }

  /coimbatore/batches/{id}:
    get:
      operationId: getCoimbatoreBatch
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Batch detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoimbatoreBatchDetail" }
    patch:
      operationId: updateCoimbatoreBatch
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoimbatoreBatchUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoimbatoreBatch" }

  /coimbatore/batches/{id}/materials:
    get:
      operationId: listCoimbatoreBatchMaterials
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Materials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoimbatoreBatchMaterial" }
    post:
      operationId: addCoimbatoreBatchMaterial
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoimbatoreBatchMaterialInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoimbatoreBatchMaterial" }

  /coimbatore/batches/{id}/materials/{materialId}:
    delete:
      operationId: deleteCoimbatoreBatchMaterial
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: materialId, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /coimbatore/batches/{id}/config:
    put:
      operationId: setCoimbatoreConfig
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoimbatoreConfigInput" }
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoimbatoreConfig" }

  /coimbatore/batches/{id}/turns:
    get:
      operationId: listCoimbatoreTurns
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Turns
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoimbatoreTurn" }
    post:
      operationId: recordCoimbatoreTurn
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoimbatoreTurnInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoimbatoreTurn" }

  /coimbatore/batches/{id}/qc:
    post:
      operationId: submitCoimbatoreQc
      tags: [coimbatore]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QcDecisionInput" }
      responses:
        "200":
          description: QC decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QcDecision" }

  # ── LAB ──────────────────────────────────────────────────────────────────────
  /lab/batches:
    get:
      operationId: listLabBatches
      tags: [lab]
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LabBatch" }
    post:
      operationId: createLabBatch
      tags: [lab]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabBatchInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabBatch" }

  /lab/batches/{id}:
    get:
      operationId: getLabBatch
      tags: [lab]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Lab batch detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabBatchDetail" }
    patch:
      operationId: updateLabBatch
      tags: [lab]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabBatchUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabBatch" }

  /lab/batches/{id}/advance:
    post:
      operationId: advanceLabBatchStage
      tags: [lab]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabStageAdvanceInput" }
      responses:
        "200":
          description: Stage advanced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabBatch" }

  /lab/batches/{id}/spawn-output:
    post:
      operationId: recordLabSpawnOutput
      tags: [lab]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
