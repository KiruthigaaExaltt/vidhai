components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, username, displayName, role, locationScope]
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, manager, operator, viewer]
        locationScope:
          type: array
          items: { type: string }
        createdAt: { type: string }

    UserInput:
      type: object
      required: [username, password, displayName, role, locationScope]
      properties:
        username: { type: string }
        password: { type: string }
        displayName: { type: string }
        role:
          type: string
          enum: [admin, manager, operator, viewer]
        locationScope:
          type: array
          items: { type: string }

    UserUpdate:
      type: object
      properties:
        displayName: { type: string }
        role:
          type: string
          enum: [admin, manager, operator, viewer]
        locationScope:
          type: array
          items: { type: string }
        password: { type: string }

    Location:
      type: object
      required: [id, code, name, description]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string }

    AlertColor:
      type: object
      required: [id, name, hexColor, condition, description]
      properties:
        id: { type: integer }
        name: { type: string }
        hexColor: { type: string }
        condition: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    AlertColorInput:
      type: object
      required: [name, hexColor, condition, description]
      properties:
        name: { type: string }
        hexColor: { type: string }
        condition: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    AlertColorUpdate:
      type: object
      properties:
        name: { type: string }
        hexColor: { type: string }
        condition: { type: string }
        description: { type: string }
        sortOrder: { type: integer }

    Material:
      type: object
      required: [id, name, unit, category]
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: ["string", "null"] }
        category: { type: string }
        categoryId: { type: ["integer", "null"] }
        unit: { type: string }
        defaultMoisturePercent: { type: ["number", "null"] }
        defaultNitrogenPercent: { type: ["number", "null"] }
        buyPricePerUnit: { type: ["number", "null"] }
        sellPricePerUnit: { type: ["number", "null"] }
        imageUrl: { type: ["string", "null"] }
        qrCode: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string }

    MaterialInput:
      type: object
