# Reference server configuration. Replace / with the deployed BASE_PATH when hosted under a subpath.
types { application/manifest+json webmanifest; font/woff2 woff2; }

location ~* ^/(sw\.js|manifest\.webmanifest|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
}
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
location / {
    try_files $uri $uri/ /index.html;
}
